<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TPV · BUHOS</title>
<link rel="stylesheet" href="/static/staff.css?v=1">
<style>
  #app { display: flex; flex-direction: column; height: 100dvh; }
  .tpv { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .pay-grid .pay-total { margin-top: 0; }
  @media (max-width: 760px) { .pay-grid { grid-template-columns: 1fr; } }
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tabs button { flex-shrink: 0; min-height: 48px; padding: 8px 16px; border-radius: 12px; background: var(--surface-2); font-weight: 800; }
  .cat-tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .catalog { display: flex; flex-direction: column; min-height: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; overflow-y: auto; align-content: start; }
  .prod { min-height: 96px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border); padding: 12px; text-align: left;
          display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .prod b { font-size: 1rem; line-height: 1.2; }
  .prod span { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .prod.out { opacity: .4; }
  .prod.out span::after { content: " · agotado"; color: var(--danger); }
  .prod:active { transform: scale(.97); }
  .ticket { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--border); }
  .t-head { display: grid; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .t-head input { min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); padding: 8px 12px; width: 100%; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { min-height: 44px; border-radius: 10px; background: var(--surface-2); font-weight: 800; font-size: .9rem; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .t-lines { flex: 1; overflow-y: auto; padding: 6px 12px; }
  .t-line { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .t-line .grow { flex: 1; min-width: 0; }
  .t-line small { color: var(--muted); display: block; }
  .t-line .q { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 10px; }
  .t-line .q button { width: 40px; height: 40px; font-size: 1.2rem; font-weight: 800; }
  .t-line .q output { min-width: 22px; text-align: center; font-weight: 800; }
  .t-line .p { font-weight: 800; min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  .t-order { background: rgba(250, 132, 5, .1); border: 1px solid rgba(250, 132, 5, .35); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
  .t-foot { padding: 12px; border-top: 1px solid var(--border); display: grid; gap: 8px; }
  .t-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.5rem; font-weight: 900; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .banner { padding: 10px 14px; background: rgba(245, 158, 11, .15); color: #fcd34d; font-weight: 700; border-bottom: 1px solid var(--border); }
  .pay-total { font-size: 2.6rem; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { min-height: 58px; border-radius: 14px; background: var(--surface-2); font-size: 1.4rem; font-weight: 800; }
  .quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
  .quick button { min-height: 50px; border-radius: 12px; background: var(--surface-3); font-weight: 800; }
  .display { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 14px; background: var(--bg); margin-bottom: 10px; }
  .display b { font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .change { text-align: center; font-size: 1.1rem; margin: 8px 0; }
  .change b { display: block; font-size: 3rem; color: var(--ok); font-variant-numeric: tabular-nums; }
  .den { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .den label { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-weight: 800; }
  .den input { width: 70px; min-height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); text-align: center; font-size: 1.1rem; }
  .diff.ok { color: var(--ok); } .diff.bad { color: var(--danger); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); margin-bottom: 6px; font-weight: 700; }
  .opt input { width: 22px; height: 22px; accent-color: var(--accent); }
  .opt em { margin-left: auto; font-style: normal; color: var(--muted); }
  .rm { display: flex; flex-wrap: wrap; gap: 6px; }
  .rm button { padding: 10px 14px; border-radius: 99px; background: var(--surface-2); font-weight: 800; }
  .rm button[aria-pressed="true"] { background: var(--danger); color: #fff; text-decoration: line-through; }
  .mobile-bar { display: none; }
  @media (max-width: 900px) {
    #app { height: auto; min-height: 100dvh; }
    .tpv { grid-template-columns: 1fr; }
    .ticket { display: none; }
    .ticket.open { display: flex; position: fixed; inset: 0; z-index: 40; }
    .grid { padding-bottom: 96px; }
    .mobile-bar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/staff.js?v=1"></script>
<script src="/static/tpv.js?v=1"></script>
</body>
</html>
